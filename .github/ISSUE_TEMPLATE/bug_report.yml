name: Bug report
description: 报告一个可复现的问题 / Report a reproducible bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请确认微信版本是 **4.1.9.x**，并**删除日志里的 wxid、联系人和密钥**。
  - type: input
    id: env
    attributes:
      label: 环境
      description: Windows 版本 / 微信版本 / Python 版本
      placeholder: Windows 11 23H2 / 微信 4.1.9.57 / Python 3.12
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 出问题的阶段
      options:
        - 取密钥
        - 读消息 / 解密
        - 发消息
        - 桥接 / 唤醒
        - 图片
        - 稳定性（锁屏/睡眠）
        - 其它
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. ... 2. ... 3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望 vs 实际
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志（脱敏）
      description: tmp\bridge.log 里相关的几行；删除 wxid、联系人、密钥
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已删除日志中的敏感信息（wxid / 密钥 / 聊天内容）
          required: true
        - label: 我已确认微信版本为 4.1.9.x
          required: true
